# 自定义关注主题配置(ch-news-reporter custom topics)
#
# 每个主题生成 profile 名 custom_<slug>;所有 active 主题每天合并产出一份日报 reports/custom_daily_<date>.md。
# slug 禁止与固定 profile(ai_daily / macro_daily / geopolitical_daily)冲突,加载时校验、冲突即报错。
#
# 主题生命周期 status:
#   active   —— 每日检索,--topic all 会带上
#   paused   —— 暂停每日检索;显式 --topic <slug> 仍可手动跑一次
#   archived —— 跟完归档,不再检索;历史 watchboard 保留可回看
#
# 字段说明:
#   focus            自然语言关注问题,注入分析层当判断锚点(模型读,脚本不读)
#   keywords         关键词列表;用双引号包住的是整体短语(如 '"Rubin ramp"'),其余为普通子串,大小写不敏感
#   exclude_keywords 命中即排除
#   time_window_days 检索时间窗(天);日频主题 1-3,低频主题 7-14
#   frequency        daily / weekly;weekly 主题不进 --topic all 的每日批量,不出每日"无增量"短报
#   state_enabled    是否启用 watchboard 跨天状态
#   open_budget      open 跟踪项软上限;0 = 显式关闭跨天状态(等价 state_enabled: false)
#
# 通道(channels):
#   news_db: true 或 {max_items: N}   items 表关键词检索(库内新闻,不含 web_search 行)
#   pg_data: {stock_tickers: [...]}   alpha_data 结构化表白名单查询,仅 PostgreSQL 可用;
#                                     可选挂钩: stock_tickers→stock_daily / index_codes→stock_index_daily /
#                                     theme_ids→theme_daily_state / tracking_tickers→stock_tracking_history
#                                     键值只接受 ASCII(^[A-Za-z0-9][A-Za-z0-9._-]{0,31}$),
#                                     中文 theme_id(如 TH-军工低空)挂不上,会被当非法键值跳过
#   web_search:                       实时 Tavily 检索,结果落库 items(source_type='web_search')
#     queries                         每主题定制 query;onboarding 时模型起草、用户确认,滚动维护
#     max_queries_per_day             每主题每日 query 上限;onboarding 期 2-3,稳定后可升 4
#   alpha_vault:                      本地 Obsidian Vault 只读检索(.md 关键词匹配)
#     enabled / paths                 paths 为 vault 内相对路径(目录或 glob);不存在或越界路径跳过并记警告
#
# 顶层 settings:
#   web_search.global_max_queries_per_day  全部主题合计的 Tavily 日调用封顶;历史日期回放不发实时请求
#   web_search.retention_days              web_search 落库证据保留天数,过期由 topic_retrieve --groom 清理
#   vault_root                             AlphaVault 根目录(~ 会展开)

settings:
  web_search:
    global_max_queries_per_day: 30
    retention_days: 90
  vault_root: "~/Library/CloudStorage/OneDrive-个人/Obsidian-Vault/1-AlphaVault"

topics:
  nvidia_rubin:
    title: 英伟达 Rubin 出货跟踪
    status: active
    frequency: daily
    focus: |
      判断 Rubin 出货是否顺利、量级如何;关注供应链(台积电/CoWoS/HBM)、
      云厂商 capex 指引、管理层表态中关于 Rubin ramp 的边际信息
    keywords: [Rubin, '"Rubin ramp"', Vera, CoWoS, HBM4]
    exclude_keywords: []
    time_window_days: 3
    channels:
      news_db: true
      pg_data:
        stock_tickers: [NVDA, 2330.TW]
        # 可扩展:未来支持 tables / custom_sql
      web_search:
        queries:
          - "NVIDIA Rubin shipment ramp 2026"
          - "Rubin CoWoS capacity allocation"
        max_queries_per_day: 3
      alpha_vault:
        enabled: true
        paths:
          - "wiki/03-产业链图谱/"
          - "wiki/10-产业跟踪/"
    state_enabled: true
    open_budget: 5

  kimi_compute:
    title: Kimi 算力部署与效率验证
    status: active
    frequency: daily
    focus: |
      跟踪 Kimi/月之暗面的算力部署量级与推理效率进展;关注能否验证
      "更少算力达到 GPT-4o 同级效果"的说法,关注 GPU/集群采购、推理成本、
      模型效率(MLA/MoE 等)与第三方实测中的边际信息
    keywords: [Kimi, 月之暗面, Moonshot, '"Kimi K2"', '"Kimi K3"']
    exclude_keywords: []
    time_window_days: 3
    channels:
      news_db: true
      # 月之暗面未上市,无直接 pg_data 挂钩;如需代理标的后续再加
      web_search:
        queries:
          - "Kimi 月之暗面 算力 部署 推理成本"
          - "Moonshot AI Kimi compute GPU infrastructure efficiency"
          - "Kimi K2 K3 inference efficiency 算力"
        max_queries_per_day: 3
      alpha_vault:
        enabled: true
        paths:
          - "wiki/02-概念词条/"
          - "wiki/10-产业跟踪/"
          - "wiki/05-行业研判/"
    state_enabled: true
    open_budget: 5

  huawei_ascend:
    title: 华为升腾芯片出货跟踪
    status: active
    frequency: daily
    focus: |
      跟踪华为升腾 910B/910C 下半年出货进展与量级;关注中芯国际代工产能与良率、
      国产替代订单(运营商/互联网大厂/政务)、美国出口管制变化对供货的边际影响
    keywords: [昇腾, 升腾, Ascend, 910B, 910C]
    exclude_keywords: []
    time_window_days: 3
    channels:
      news_db: true
      pg_data:
        stock_tickers: [688981.SH]   # 中芯国际,代工产能代理观察
      web_search:
        queries:
          - "华为 昇腾 910C 出货 量产"
          - "Huawei Ascend 910B 910C shipment volume"
          - "昇腾 910C 中芯国际 产能 良率"
        max_queries_per_day: 3
      alpha_vault:
        enabled: true
        paths:
          - "wiki/01-个股词条/"
          - "wiki/03-产业链图谱/"
          - "wiki/10-产业跟踪/"
    state_enabled: true
    open_budget: 5

  ai_model_frontier:
    title: AI 模型前沿进展与算力需求
    status: active
    frequency: daily
    focus: |
      跟踪全球主要 AI 模型的最新进展:产品发布、技术迭代、模型代际演进、
      能力跃迁(跑分/实测/新模态/新形态);并重点判断这些进展对算力需求的
      边际影响——模型效率提升(架构/量化/稀疏化)与规模扩张、推理 token 通胀、
      训练集群扩建两股力量相抵后,算力供需在变得更紧缺还是更宽松。
    keywords: [
      OpenAI, GPT, Claude, Anthropic, Gemini, DeepMind, Llama, Grok, xAI,
      DeepSeek, Qwen, 通义, Kimi, 月之暗面, GLM, 智谱, Mistral, 混元, 豆包, 文心,
      大模型, 开源模型, 权重, 跑分, benchmark, 多模态, 推理模型,
      算力, GPU, GB200, GB300, B200, H200, 集群, 训练成本, 推理成本
    ]
    exclude_keywords: []
    time_window_days: 2
    channels:
      news_db: true
      web_search:
        queries:
          - "frontier AI model release benchmark 2026"
          - "AI model capability leap compute demand GPU"
          - "大模型 发布 跑分 算力 需求"
        max_queries_per_day: 3
      alpha_vault:
        enabled: true
        paths:
          - "wiki/10-产业跟踪/"
          - "wiki/05-行业研判/"
          - "wiki/02-概念词条/"
    state_enabled: true
    open_budget: 5

  commercial_space:
    title: 商业航天产业跟踪
    status: active
    frequency: daily
    focus: |
      跟踪全球商业航天产业的实际进度,不写发射流水账——每条事件都要接回下面四条主线之一,
      并说清它改变了谁的相对位置:

      1) 发射与运力:入轨成功/失败、年度发射节奏、可重复使用的复用次数与周转天数、
         单公斤入轨成本、发射工位与发射场产能、新型号首飞与定型进度。
      2) 卫星与载荷:星座在轨数量与组网进度、卫星批产线产能与交付节奏、载荷能力代际
         (相控阵、激光星间链路、直连手机、遥感分辨率与重访)、频轨资源期限压力。
      3) 订单披露:政府与军方合同(NASA、太空军、欧空局、国内政府采购与军方)的中标方、
         金额、周期与交付节点,发射服务与星座采购合同,卫星与载荷的批量订单,上市公司
         公告口径的合同金额,以及订单转收入的兑现进度(签了多少、确认了多少)。
      4) 产业融资:一级市场融资轮次、金额与估值(标明口径),并购与战略投资,IPO 全流程
         节点(辅导备案/受理/问询/递表/注册/发行),老股转让与股权变动,地方产业基金与
         国家级基金的出资,上市公司定增募投中投向航天业务的部分。

      国内同行事件是本主题的重点,单列一条说明:凡是国内同行(民营公司与院所)的具体动作,
      都算够格增量,不适用"信息量不大就不写"的门槛——对同行相对位置的判断,正是靠这些
      动作一条条累积出来的。至少要覆盖:战略合作与框架协议的签订、供货与采购协议、产业
      活动的组织与出席(发布会、论坛、专家会议、开放日、招标会)、火箭进场与转运、总装
      测试与出厂评审、试车与静力试验、发射与回收试验、发射工位与产线的竣工投产、重要
      人事与股权变动。按事件性质归进上面四条主线;归不进去的(典型如活动组织、人事变动)
      就挂在该公司当天的段落里一并说清,不为它单开小节。

      报告结构上国内在前、海外在后:国内按上面四条主线分节写,海外不分主线、全部合并成
      一节(取舍与篇幅见 references/reports/custom_topic/commercial_space_output.md)。

      重点主体分两条线跟。国外:NASA、SpaceX(Starship / Falcon / Starlink)、Blue Origin、
      Rocket Lab、ULA、Arianespace 与 ESA、Amazon Kuiper、AST SpaceMobile、Planet、
      Firefly、Stoke、Relativity,以及 ISRO / JAXA / Roscosmos 等国家机构。国内:航天科技集团与航天科工(含运载火箭技术研究院、
      空间技术研究院、上海航天技术研究院、航天推进技术研究院等院所)、中科院微小卫星创新研究院、
      中国星网与垣信(千帆星座),以及蓝箭航天、天兵科技、星际荣耀、星河动力、中科宇航、
      东方空间、深蓝航天、银河航天、长光卫星、微纳星空、国星宇航等民营公司。

      一个易错点:SpaceX 已与 xAI 合并并上市(SPCX.O),同名新闻里有大量 Grok、AI 编程、
      持仓披露的内容,关键词层面挡不干净——只有涉及航天业务(发射、星链、星舰、订单、产能)
      的才算本主题增量,AI 侧进展归 ai_model_frontier;13F/估值类消息只在能推断 SpaceX
      航天业务估值与融资能力时才写。

      判断纪律:官方口径或多源一致的才算确认事实;单源的试飞、订单、融资传闻降级为线索,
      标"未经证实"。国内一级市场信息多为转述,估值与金额要标可信度。中美两条产业线分开记,
      不要用一边的节奏去推断另一边。

      边界:低空经济、eVTOL、民航客机、纯天文科普不进本主题,除非与航天主体直接相关
      (可重复使用飞行器、空天飞机、卫星应用落地场景)。地外探索与空间站(探月、火星、
      小行星、载人登月、ISS 与商业空间站、天宫)也不在本主题范围内——这类任务只有在它
      直接改变某家公司的发射订单、运力占用或产能时,才作为发射与运力那条主线的证据带一句。
    keywords: [
      # --- 国外主体与型号 ---
      SpaceX, Starship, '"Falcon 9"', '"Falcon Heavy"', Starlink, NASA,
      '"Blue Origin"', '"New Glenn"', '"Rocket Lab"', Neutron, '"United Launch Alliance"',
      '"Vulcan Centaur"', '"Vulcan rocket"', Arianespace, '"Ariane 6"',
      '"European Space Agency"', Roscosmos, ISRO, JAXA, Kuiper,
      '"AST SpaceMobile"', '"Planet Labs"', '"Firefly Aerospace"', '"Stoke Space"',
      '"Relativity Space"', '"Space Force"', Starshield,
      # --- 国外通用词(刻意避开 space / constellation 这类会误伤 workspace、
      #     Constellation Energy 的宽词) ---
      satellite, spacecraft, spaceflight, spaceport, '"launch vehicle"', '"orbital launch"',
      smallsat, '"space startup"',
      # --- 国内主体、型号与任务 ---
      航天, 商业航天, 运载火箭, 可重复使用, 一箭多星, 发射场, 卫星互联网, 卫星制造,
      卫星载荷, 遥感卫星, 星座组网, 低轨, 在轨, 入轨, 星链, 千帆星座, 中国星网, 北斗,
      长征, 朱雀, 天龙二号, 天龙三号, 引力一号, 力箭, 谷神星, 快舟, 捷龙,
      # 注:星际荣耀的公司全名是"星际荣耀航天科技集团股份有限公司",会连带命中
      #     航天科技集团(CASC)这个词;两个词同时出现在 matched_keywords 时按民营公司算
      航天科技集团, 航天科工,
      # --- 国内民营/混合所有制公司:29 家,口径同《中国商业航天融资全景图》(2026-08-18)
      #     按该图的赛道分组排列,改动时对着原图核 ---
      # 运载火箭与发射服务(12)
      蓝箭航天, 天兵科技, 星际荣耀, 星河动力, 中科宇航, 东方空间, 深蓝航天,
      宇石空间, 大航跃迁, 箭元科技, 微光启航, 致航科技,
      # 火箭动力与上游配套(2)
      九州云箭, 星辰基石,
      # 卫星星座运营(4)
      垣信, 银河航天, 时空道宇, 星移联信,
      # 卫星制造与载荷(5)
      长光卫星, 微纳星空, 国星宇航, 天仪空间, 瑞启深空,
      # 测运控与地面段(1)
      航天驭星,
      # 星间激光通信(3)
      极光星通, 氦星光联, 光邮星空,
      # 天基算力与太空 AI(2;"超低轨(济南)科技"公司名带括号,子串匹配不到,
      #   用赛道词 超低轨 兜住,它同时也是 VLEO 这条技术线的检索词)
      一行凌光, 超低轨,
      # --- 上面这些公司的英文写法:英文源报道中国公司时只用英文名,
      #     金十等中文源命中不到。实测 NASASpaceflight 单日 LandSpace 命中 18 次 ---
      LandSpace, '"Space Pioneer"', '"Galactic Energy"', '"CAS Space"', Orienspace,
      '"Deep Blue Aerospace"', Cosmoleap, '"Rocket Pi"', Sepoch, SpaceSail, Qianfan,
      GalaxySpace, Geespace, Spacety, MinoSpace, '"ADA Space"', '"Chang Guang"',
      # 星际荣耀写 '"i-Space"' 而不是 iSpace:后者是子串,会命中 Omnispace(另一家
      # D2D 卫星公司,SpaceNews 当天就有一条),实测误伤已复现
      '"i-Space"', Hyperbola,
      # 英文源常只写型号不写公司名(实测单日 Zhuque 命中 15 次),型号英文名单列
      Zhuque, '"Long March"', Tianlong, Kinetica, '"Ceres-1"', '"Gravity-1"',
      Kuaizhou, Jielong, Guowang
    ]
    # 两类噪音:消费向天文/占星(主要来自 Space.com);以及 SpaceX 与 xAI 合并后
    # (上市代码 SPCX.O)"SpaceX"/"SpaceXAI" 同名新闻里大量 Grok、AI 编程的内容
    exclude_keywords: [流星雨, 星座运势, 占星, horoscope, stargazing, '"telescope deal"', Grok, Cursor]
    time_window_days: 2
    channels:
      # 面比其他主题宽(发射/卫星/深空/资本四条线 × 中美两地),条数上限相应放宽
      news_db:
        max_items: 120
      pg_data:
        # A 股商业航天链的价格锚:火箭总体与上游锻件、星上电子与载荷芯片、卫星总体、
        # 卫星应用与终端。stock_daily 只有 A 股,RKLB / ASTS 等美股取不到,海外标的
        # 靠 web_search;theme_daily_state 的中文 theme_id 挂不上(键值须 ASCII)。
        stock_tickers:
          - 003009.SZ   # 中天火箭
          - 605123.SH   # 派克新材(火箭发动机锻件)
          - 600879.SH   # 航天电子
          - 600118.SH   # 中国卫星
          - 300762.SZ   # 上海瀚讯(卫星通信)
          - 001270.SZ   # 铖昌科技(相控阵 T/R 芯片)
          - 688270.SH   # 臻镭科技(星载射频)
          - 688568.SH   # 中科星图
          - 688066.SH   # 航天宏图
          - 002465.SZ   # 海格通信(北斗终端)
        # 没挂 index_codes:最贴近的申万国防军工(801740.SI)在库里落后好几个交易日,
        # 挂上只会天天产出"无数据行"警告,反而稀释了 coverage 警告的信号价值。
      web_search:
        # 顺序即优先级:预算只够前 N 条时 retriever 取列表前 N 条。国内线最缺 RSS 覆盖,
        # 排第一;国外产业主干已有 10 个 space RSS 打底,实时检索主要补资本与政策。
        queries:
          - "商业航天 民营火箭 卫星互联网 发射 中标 融资 进展"
          - "commercial space launch satellite company contract award"
          - "space startup funding round investment valuation satellite"
          - "商业航天 战略合作 签约 中标 火箭出厂 转运 试车 发射工位 竣工"
        max_queries_per_day: 4
      alpha_vault:
        enabled: true
        paths:
          - "wiki/03-产业链图谱/"              # 含航天低空.md
          # 10-产业跟踪 下 80% 是 ai_daily / semicon_ai_track,它们只靠 SpaceX 一词命中,
          # 会把按 mtime 排序的 20 篇笔记额度挤满;这里只 glob 产业链日报
          - "wiki/10-产业跟踪/*产业链日报.md"
          - "wiki/05-行业研判/"
          - "wiki/01-个股词条/"
    state_enabled: true
    # 四条主线各留 1-2 条 open 跟踪项(订单与融资两条通常最活跃)
    open_budget: 6
