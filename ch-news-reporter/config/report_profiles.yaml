profiles:
  ai_daily:
    title: AI 日报
    timezone: Asia/Shanghai
    sources:
      - product_hunt
      - hacker_news
      - github_trending
      - rss
      - jin10
      - cls
    state_enabled: true
    # watchboard frame 字段:AI 日报每天滚动跟踪的快变量
    state_schema:
      hot_themes: {type: list, required: true}   # 在跟踪的方向信号(MCP 工具链 / AI Coding ...),至少 1 条
      watch_companies: {type: list}   # 预期近期有动作的厂商
      watch_projects: {type: list}    # 待验证热度→趋势的开源项目
    # 重点公司归类字典:Agent 读取 evidence packet 后用这个字典把当日新闻按公司归类
    # 到"模型发布 / 产品更新 / API & 定价 / 融资 & 政策"四类动作矩阵中。
    # 字典只供 Agent 阅读,不由 prepare_report_data.py 预先归类。
    company_groups:
      international:
        OpenAI:
          keywords: [OpenAI, ChatGPT, GPT, GPT-4, GPT-5, Sora, Codex, Whisper, DALL-E, Sam Altman]
        Anthropic:
          keywords: [Anthropic, Claude, Claude Code, Claude.ai, Claude Sonnet, Claude Opus, Claude Haiku, Dario Amodei]
        Google:
          keywords: [Google AI, Gemini, DeepMind, Google DeepMind, Bard, Veo, Imagen, Gemma, Sundar Pichai, Demis Hassabis]
        Meta:
          keywords: [Meta AI, Llama, LLaMA, FAIR, Mark Zuckerberg, Yann LeCun]
        Mistral:
          keywords: [Mistral, Mistral Large, Mixtral, Codestral, Arthur Mensch]
        NVIDIA:
          keywords: [NVIDIA, Jensen Huang, CUDA, H100, H200, B100, B200, Blackwell, Grace Hopper]
        HuggingFace:
          keywords: [HuggingFace, Hugging Face, Transformers, "HF Hub"]
      china:
        Kimi:
          keywords: [Kimi, Moonshot, 月之暗面, K2]
        智谱:
          keywords: [智谱, 智谱AI, ChatGLM, GLM, GLM-4, Zhipu]
        Minimax:
          keywords: [Minimax, MiniMax, 海螺, 海螺AI, abab, Hailuo]
        腾讯:
          keywords: [腾讯混元, 混元, Hunyuan, 腾讯元宝, 元宝]
        阿里:
          keywords: [通义, 通义千问, Qwen, Qwen2, Qwen3, 通义灵码, 阿里云AI, 阿里AI]
        字节:
          keywords: [豆包, Doubao, 字节豆包, 字节AI, Seed, 火山引擎, 火山方舟]
        DeepSeek:
          keywords: [DeepSeek, DeepSeek-V3, DeepSeek-R1, 深度求索]
        百度:
          keywords: [文心, 文心一言, ERNIE, Wenxin, 百度AI]

  iran_dynamic:
    title: 美以伊动态播报
    timezone: Asia/Shanghai
    sources:
      - jin10
      - cls
      - rss
    state_enabled: true
    # watchboard frame 字段:伊朗动态每天滚动跟踪的快变量(取代旧 frame_*.md 离散相位)
    state_schema:
      path: {required: true, enum: [A, B, C]}   # A 续期 / B 交战 / C 僵尸化
      sub_branch: {}                            # A-1/B-2/C-1 ...
      intensity: {}                             # 烈度级别
      actor_weights: {required: true, type: list}   # 行为体权重排序
      signal_watchlist: {type: list}            # 当日核心信号清单(可增删)
      probabilities: {type: map, sum: 100}      # A/B/C 概率,和=100

  macro_daily:
    title: 每日宏观日报
    timezone: Asia/Shanghai
    sources:
      - jin10
      - cls
      - rss
    state_enabled: true
    # watchboard frame 字段:宏观日报每天滚动跟踪的快变量
    state_schema:
      swing_factor: {required: true}    # 当下流动性主驱动维度(利率/汇率/政策预期/风险偏好)
      liquidity_bias: {enum: [收紧, 边际收紧, 中性, 边际宽松, 宽松]}
      position_regime: {type: map}      # {纳指: 高/中/低, 上证: 高/中/低}
      imminent_data_events: {type: list}    # 临近的 CPI/PPI/社融/PMI/非农/FOMC 带日期
    macro_data: true
    macro_keywords:
      - 宏观
      - 经济数据
      - 央行
      - 美联储
      - 人民银行
      - 货币政策
      - 财政
      - 利率
      - 收益率
      - 国债
      - 美债
      - 通胀
      - CPI
      - PPI
      - PCE
      - PMI
      - 社融
      - 社会融资
      - 非农
      - 就业
      - 初请
      - 失业率
      - 零售销售
      - GDP
      - 汇率
      - 人民币
      - 美元
      - 原油
      - 布伦特
      - 黄金
      - 天然气
      - 大宗商品
      - 库存
      - OPEC
      - EIA
      - API
      - 风险资产
    data_event_keywords:
      - 公布
      - 发布
      - 出炉
      - 录得
      - 实际
      - 预期
      - 前值
      - 初值
      - 终值
      - 修正
      - announce
      - released
      - actual
      - forecast
      - previous
