# RSS sources for ch-news-reporter.
#
# Add or remove items under `rss`. Keep `name` stable because it is written to
# the SQLite `source_name` column and used for deduplication.
#
# AI 日报重点公司信源覆盖说明:
#   有官方 RSS: OpenAI / Google AI / HuggingFace / NVIDIA / Microsoft AI
#   无官方 RSS(由 Agent 通过 The Decoder / Juya / AI Hot / 金十等转述源 enrich):
#     Anthropic / Meta AI / Google DeepMind / Mistral
#   中国厂商(均无英文官方 RSS,Kimi/智谱/Minimax/腾讯/阿里/字节/DeepSeek/百度): 同上,经第三方源 enrich
#
# AI 日报二级信号层(观点/解读,非厂商一手;均为带每条发布时间的可抓取 RSS):
#   独立分析 / Newsletter: Ben's Bites / TLDR AI / Import AI(Jack Clark)/ The Neuron /
#     Latent Space / Interconnects(Nathan Lambert)/ One Useful Thing(Ethan Mollick)/
#     Unsupervised Learning(Daniel Miessler)/ Stratechery(Ben Thompson)/ Simon Willison
#   创作者 / YouTube(channel feed,仅标题+描述,无字幕): AI Explained / Matthew Berman /
#     Two Minute Papers / Yannic Kilcher / 3Blue1Brown / Fireship
#
# 商业航天信源层(category: space,服务 custom_topics 的 commercial_space 主题):
#   产业与资本: SpaceNews / Payload / TechCrunch Space
#   发射与工程: NASASpaceflight / Spaceflight Now / Ars Technica Space
#   官方与政策: NASA Breaking News / SpacePolicyOnline
#   区域补充:   European Spaceflight(欧洲民营) / Space.com(广谱,含 ISS 与任务动态)
#   已核实但不入表: ESA Space News(rssfeed/Our_Activities/Space_News 抓得到但内容停在 2026-01,
#     每天只会写 feed_empty 诊断行);国内商业航天(蓝箭/天兵/星际荣耀/垣信/中国星网/各院所)
#     没有可抓的官方 RSS,靠金十电报 + 主题 Tavily 中文 query + AlphaVault 笔记补。

# 已核实但本 skill 抓不到(不入下表,需 enrich/浏览器兜底):
#   The Rundown AI、Superhuman AI —— beehiiv RSS token 仅客户端注入,SSR HTML 取不到
#   The Batch(Andrew Ng) —— rss.xml 上游持续返回 HTTP 500

# --only-missing 的每源最小行数阈值(collect_news.py 读取;--min-rows N 可全源覆盖)。
# 低于阈值视为"覆盖不足"并重采,避免旧默认"一条即齐"的假覆盖。典型日产量注释在旁。
collect_min_rows:
  jin10: 300            # 金十电报典型日产量 300-600 条
  rss: 45               # 45 个 feed(含 10 个商业航天源),典型日合计 80-160 条
  github_trending: 20   # 日榜约 25 个仓库
  product_hunt: 10      # featured 日榜约 10-20 个
  hacker_news: 20       # top/best 合并去重后约 30-60 条
  polymarket: 10        # 快照型,关键词过滤后约 10-50 条

rss:
  - name: OpenAI Blog
    url: https://openai.com/news/rss.xml
    category: ai
    enabled: true
  - name: Google AI Blog
    url: https://blog.google/innovation-and-ai/technology/ai/rss/
    category: ai
    enabled: true
  - name: Hugging Face Blog
    url: https://huggingface.co/blog/feed.xml
    category: ai
    enabled: true
  - name: NVIDIA Developer Blog
    url: https://developer.nvidia.com/blog/feed/
    category: ai
    enabled: true
  - name: NVIDIA Blog
    url: https://blogs.nvidia.com/feed/
    category: ai
    enabled: true
  - name: Microsoft AI Blog
    # 旧 blogs.microsoft.com/ai/feed/ 已 410 Gone；切换到官方 AI 主题源 news.microsoft.com
    url: https://news.microsoft.com/source/topics/ai/feed/
    category: ai
    enabled: true
  - name: The Decoder
    url: https://the-decoder.com/feed/
    category: ai
    enabled: true
  - name: Juya AI Daily
    url: https://daily.juya.uk/rss.xml
    category: ai
    enabled: true
  - name: AI Hot
    url: https://aihot.virxact.com/feed/all.xml
    category: ai
    enabled: true

