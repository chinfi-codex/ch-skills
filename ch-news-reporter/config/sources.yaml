# RSS sources for ch-news-reporter.
#
# Add or remove items under `rss`. Keep `name` stable because it is written to
# the SQLite `source_name` column and used for deduplication.
#
# AI 日报重点公司信源覆盖说明:
#   有官方 RSS: OpenAI / Google AI / HuggingFace / NVIDIA / Microsoft AI
#   无官方 RSS(由 Agent 通过 The Decoder / Juya / AI Hot / 金十等转述源 enrich):
#     Anthropic / Meta AI / Google DeepMind / Mistral
#   中国厂商(均无英文官方 RSS,Kimi/智谱/Minimax/腾讯/阿里/字节/DeepSeek/百度): 同上,经第三方源 enrich

rss:
  - name: OpenAI Blog
    url: https://openai.com/news/rss.xml
    category: ai
    enabled: true
  - name: Google AI Blog
    url: https://blog.google/innovation-and-ai/technology/ai/rss/
    category: ai
    enabled: true
  - name: Hugging Face Blog
    url: https://huggingface.co/blog/feed.xml
    category: ai
    enabled: true
  - name: NVIDIA Developer Blog
    url: https://developer.nvidia.com/blog/feed/
    category: ai
    enabled: true
  - name: NVIDIA Blog
    url: https://blogs.nvidia.com/feed/
    category: ai
    enabled: true
  - name: Microsoft AI Blog
    url: https://blogs.microsoft.com/ai/feed/
    category: ai
    enabled: true
  - name: The Decoder
    url: https://the-decoder.com/feed/
    category: ai
    enabled: true
  - name: Juya AI Daily
    url: https://imjuya.github.io/juya-ai-daily/rss.xml
    category: ai
    enabled: true
  - name: AI Hot
    url: https://aihot.virxact.com/feed/all.xml
    category: ai
    enabled: true
  - name: Federal Reserve Press Releases
    url: https://www.federalreserve.gov/feeds/press_all.xml
    category: finance
    enabled: true
  - name: SEC Press Releases
    url: https://www.sec.gov/news/pressreleases.rss
    category: finance
    enabled: true
