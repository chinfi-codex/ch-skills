# 频控、时效与活跃时段的默认值。状态文件中的 policy 覆盖这里（control 子命令写入）。
timezone: Asia/Shanghai
heartbeat_minutes: 30
active_start: "06:00"                # 可投递时段；静默期 = 其补集
active_end: "23:00"
evaluate_in_quiet_hours: true        # 静默期照常扫描与评估，只推迟投递；false 则静默期完全不扫描
scheduled_reviews: ["08:35", "15:40"]
quiet_start: "23:00"
quiet_end: "06:00"
min_notification_interval_minutes: 120
max_notifications_per_day: 4
max_candidates_per_wake: 6
max_decision_attempts: 4
max_trend_age_days: 3
evaluation_lease_minutes: 30        # 从备好批次到评估返回的最长等待；超时计一次失败
catalyst_max_age_days: 7
pending_notification_ttl_hours: 24
max_evaluations_per_hour: 4          # 事件唤醒的限流，防止批量写入引发评估风暴
max_evaluations_per_day: 30
compact_after_days: 3                # 终态候选在主状态保留多久后压缩进索引
