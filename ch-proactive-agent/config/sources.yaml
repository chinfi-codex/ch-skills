# 数据源适配器登记：扫描逻辑与触发方式同源登记。
#
# 字段：
# - enabled / rank：是否采集；呈现顺序（rank 小的在前，同源内观察日新的在前），超出
#   max_candidates_per_wake 的部分留到下一轮。
# - watch：pulse 的水位来源。files 为金库内相对路径 glob；pg_watermarks 为只读水位查询；
#   skills 为收尾时会发 `signal --source skill:<名称>` 的长任务 Skill。
# - debounce：水位变化后安静 quiet_seconds 或最长等 max_wait_seconds 才扫描，合并批量写入。
# - cooldown_hours：同一主题（topic_key，由代码确定）上次发出后多久内不再提醒。
# - default_priority：仅作文档参考，实际优先级由评估模型给出。
# 新增数据源先在这里登记、local 影子验证，再进入微信投递。
schema_version: 1

sources:
  trend_state:
    enabled: true
    rank: 0
    watch:
      skills: [a-stock-daily-market-sense]
      # trend_state.py 读取的三张表；融资数据会回补历史日期，所以取近 10 天的聚合而不只看最大日期
      pg_watermarks:
        - "SELECT max(date), count(*), sum(coalesce(margin_net_buy, 0)) FROM market_history WHERE date >= current_date - 10"
        - "SELECT max(trade_date), count(*) FROM stock_index_daily WHERE trade_date >= current_date - 10"
        - "SELECT max(trade_date) FROM stock_daily"
    debounce: {quiet_seconds: 120, max_wait_seconds: 300}
    topic_key: "trend:axis"
    cooldown_hours: 6
    default_priority: P1

  framework_review:
    enabled: true
    rank: 1
    watch:
      files:
        - ledgers/industry-board/board.json
        - ledgers/industry-board/board_history.jsonl
      schedule: "daily@08:35"
    debounce: {quiet_seconds: 60, max_wait_seconds: 300}
    topic_key: "framework_review:industry-board"
    cooldown_hours: 168
    default_priority: P3

  framework_change:
    enabled: true
    rank: 2
    watch:
      files: ["wiki/04-交易方法论/**/*.md", "system/frameworks/*框架.md"]
    debounce: {quiet_seconds: 600, max_wait_seconds: 3600}
    topic_key: "framework_change:{path}"
    cooldown_hours: 72
    default_priority: P3

  catalyst:
    enabled: true
    rank: 3
    watch:
      files: [ledgers/catalyst-events/events.jsonl]
    debounce: {quiet_seconds: 180, max_wait_seconds: 600}
    topic_key: "catalyst:{event_id}"
    cooldown_hours: 72
    default_priority: P2

  scheduled_review:
    enabled: true
    rank: 4
    watch:
      schedule: "trading_days@08:35,15:40"
    topic_key: "trend:axis"      # 固定窗口的提醒内容就是趋势复核，与趋势共用冷却
    cooldown_hours: 6
    default_priority: P2
