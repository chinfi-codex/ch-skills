# Skill Sync Hub —— 跨 Agent 技能同步配置
# 参考 neuDrive Bundle Sync 思路：本仓库作为 canonical source，
# 通过 Git Hook 在 commit / pull 后自动单向同步到各 Agent 安装目录。
#
# 使用方式:
#   python scripts/skill_sync.py              # 一次性复制同步
#   python scripts/skill_sync.py --link       # 建立 Junction（开发推荐，实时生效）
#   python scripts/skill_sync.py --dry-run    # 预览变更
#   python scripts/skill_sync.py --install-hook   # 安装 post-commit / post-merge / post-rewrite Git Hooks

targets:
  # Agent 品牌目录（Kimi CLI 启动时会按优先级自动扫描）
  # 开启 merge_all_available_skills = true 后，Kimi 会合并所有品牌目录
  kimi:    "~/.kimi/skills"
  claude:  "~/.claude/skills"
  codex:   "~/.codex/skills"
  hermes:  "~/.hermes/skills"
  openclaw: "~/.openclaw/skills"

# 重命名映射：源目录名 → 目标 skill 名
# 键为相对于仓库根的路径，值为目标目录名
rename: {}

# 仓库级共享运行时代码会被打包到指定 skill 内，保证同步/发布后的 skill 自包含。
# 按「通用能力」分组：data（数据库连接层 + schema + 文档）、html_report（报告渲染框架）。
# skills 可写目标 skill 名，或源仓库相对路径；dest 必须是 skill 包内部相对路径。
# 数据库型 skill 必须加入 data bundle，才能在各 Agent 安装目录中获得 scripts/_shared/db_core.py
# 与 scripts/_shared/db_ping.py（dest 扁平到 _shared/ 根，保持 skill 脚本 `from db_core import` 不变）。
shared:
  bundles:
    # data 能力：连接层 db_core + 自检 db_ping + 契约 POSTGRESQL.md + 建表 init_alpha_data.sql
    - source: shared/data
      dest: scripts/_shared
      skills:
        - ch-news-reporter
        - a-stock-daily-market-sense
    # html 能力：报告渲染框架（Markdown→HTML + 内联图表）
    - source: shared/html_report
      dest: scripts/_shared/html_report
      skills:
        - a-stock-analyzer
        - chstock-usmarket-report
        - ch-news-reporter
        - a-stock-daily-market-sense
        - ch-tech-explainer
    # web_search 能力：Tavily 联网检索（WebFetch/WebSearch 在部分网络下不可达时的主路径）
    - source: shared/web_search
      dest: scripts/_shared/web_search
      skills:
        - chstock-usmarket-report
        - ch-news-reporter

# 排除规则（开发/评测产物，不同步到 Agent 安装目录）
exclude:
  dirs:
    - .git
    - __pycache__
    - .pytest_cache
    - evals
    - benchmarks
    - "*-workspace"
    - node_modules
    - venv
    - .venv
  files:
    - benchmark.json
    - benchmark.md
    - grading.json
    - timing.json
    - metrics.json
    - transcript.md
    - review.html
    - feedback.json
    - test_*.py
    - "*_test.py"
    - .env
    - "*.pyc"
    - .DS_Store
    # ch-news-reporter 运行时残留:watchboard 状态、enrichment targets,运行时自动重建,不进发布包
    - "*watchboard.json"
    - selected_targets.json
  # skill 根级排除：{skill 名: [根下目录名]}，只命中该 skill 根下的目录，
  # 不误伤嵌套同名目录（如 ch-news-reporter/references/reports 仍正常同步）。
  # 被排除目录在 Agent 目标端也不会被镜像删除，运行时产物得以保留。
  skill_root_dirs:
    a-stock-daily-market-sense:
      - reports
